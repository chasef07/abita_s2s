name: Abita live office and provider knowledge
# Uses the live Product knowledge endpoint configured by ACUITY_PRODUCT_KNOWLEDGE_URL
# and ABITA_EYE_GROUP_PRODUCT_SERVICE_SECRET. Credentials stay in the runtime
# environment, never in this file. Judge facts against captured
# tool results. An unavailable search leaves the successful retrieval path unproven.
scenarios:
  - label: Spring Hill office hours and address
    instructions: >
      Ask for the Spring Hill office's weekday hours and street address.
      Then ask them to repeat the closing time. You only need office information,
      not an appointment. Decline staff help if offered and end the call.
    agent_expectations: >
      Gives Spring Hill's weekday hours and street address from office knowledge,
      and repeats the closing time when asked. Does not invent information.
    userdata:
      office: spring-hill
  - label: Spring Hill provider information
    instructions: >
      Ask which doctors see patients at Spring Hill and what they specialize in.
      After the answer, ask whether Dr. Bach sees children for routine eye exams
      and whether a five-year-old can be scheduled for one. You are only asking
      about office policy, not booking or seeking medical advice. Decline staff
      help if offered and end the call.
    agent_expectations: >
      Answers which doctors see patients at Spring Hill and the pediatric question
      from office knowledge. Does not invent providers, specialties, or policies.
    userdata:
      office: spring-hill
