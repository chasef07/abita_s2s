name: Abita appointment changes
# Sandbox fixtures: Maya Singleproof, DOB 05/12/1985, +12025550148 must resolve
# uniquely with accepted medical insurance, valid routing and no authorization
# requirement, with at least two eligible future medical slots. Book, reschedule
# and cancel run in one call on the visit that call creates, so the chart ends
# where it started and the case does not depend on suite order or earlier runs.
# A failure partway through can leave that visit behind; cancel it before rerunning.
# Userdata does not seed fixtures.
# Verify tool arguments, receipts, backend state and spoken claims. Missing fixtures
# leave the intended action unproven; safe failure handling alone is not a pass.
scenarios:
  - label: Book, reschedule, then cancel the same appointment
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Ask to book the soonest medical appointment for mild dry eyes for several
      weeks, without pain or sudden vision changes. You have no referring doctor
      and your insurance has not changed. Give your first name when asked and DOB
      only if needed. Choose an actual returned slot and approve an accurate final
      date, time and provider read-back. After the booking is confirmed, say that
      date no longer works and ask to move that same appointment to a later date.
      Choose an actual later returned slot and approve an accurate read-back of the
      old and new appointment. After the move is confirmed, say your plans changed
      and ask to cancel that moved appointment. Approve an accurate read-back, keep
      any other visits, do not request another booking, and end after the
      cancellation result is explained.
    agent_expectations: >
      Finds Maya's chart, then books a returned opening, moves it to a later
      returned opening, and cancels it, getting the caller's approval before each
      change. Describes each result accurately.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'
