name: Abita adjacent-date slot identity regression
# Reproduces RM_HdbUH2tkcQLv: October 13 at 11 AM was confirmed aloud,
# but the October 14 at 11 AM reference was submitted to booking.
# Sandbox-only prerequisites: a uniquely resolving Maya Singleproof
# (DOB 05/12/1985, +12025550148), accepted on-file medical insurance, valid
# routing and no authorization requirement. Seed two consecutive weekdays at
# 11:00 AM Eastern with Dr. Austin Bach in Spring Hill, both 7-20 days after the
# run date, so they appear together in one 14-day search starting a week out.
# Userdata does not create fixtures or set the call clock.
# Missing fixtures, wrong clock, or failed middleware means unproven, not pass.
# Capture timestamped tool output, speech, arguments, receipt and provider state.
scenarios:
  - label: Confirm October 13 without submitting the October 14 reference
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12,
      1985. Ask to book a medical appointment for mild dry eyes for several weeks,
      without pain or sudden vision changes. Your insurance is unchanged and
      you have no referring doctor. Give Maya when asked and DOB if needed.
      Ask to look at appointments starting one week from today, specifically
      with Dr. Austin Bach at 11 AM. When offered 11 AM on two consecutive days,
      choose the EARLIER day. Approve only an accurate complete read-back of that
      earlier date at 11 AM with Dr. Austin Bach. If the receptionist reads back
      the later day, correct them before giving approval. End after the booking
      result.
    agent_expectations: >
      Resolves the patient and returns 11 AM slots on two consecutive days
      with Dr. Austin Bach from one availability search. Reads back and obtains
      approval for the earlier day at 11 AM with that provider.
      The FIRST book_appointment call must submit the exact reference assigned
      to the earlier day at 11 AM in the latest valid tool result, with readBack
      true. Fail if it submits the later day's reference, even if it later
      detects and repairs the error. Exactly one appointment write books the
      earlier day at 11 AM with Dr. Austin Bach, as shown by the receipt and
      provider state. Spoken confirmation must match. No cancellation or
      reschedule is needed. A correct tool return alone does not prove the model
      selected correctly; compare the confirmed speech and booking argument
      against the slot mapping.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'
