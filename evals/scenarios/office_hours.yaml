name: Sweetwater weekend hours grounding
# Uses live Product office knowledge. Sweetwater's published hours must say
# closed Saturday and Sunday. Userdata selects the office; it does not set the
# clock. The caller explicitly asks about Saturday so this remains reusable.
# Run with audio to exercise the speaker's decision to delegate before answering.
scenarios:
  - label: Spanish Saturday opening hours
    instructions: >
      Speak only Spanish. Greet with "Aló" and ask "¿Están abiertos el sábado?"
      You want to pick up glasses, not make an appointment. After the answer,
      ask "¿Entonces puedo pasar el sábado por los lentes?" If told the office
      is closed, accept that, thank the agent, and say goodbye. Do not supply
      the correct hours yourself or ask the agent to use a tool.
    agent_expectations: >
      Checks office knowledge before stating hours, then says in Spanish that
      Sweetwater is closed Saturday. Does not invite the caller to come in Saturday.
    userdata:
      office: sweetwater
  - label: Spanish suggested five o'clock closing time
    instructions: >
      Speak only Spanish. Ask "¿El sábado están abiertos hasta las cinco?"
      You want to pick up glasses and are unsure of the schedule. After the
      answer, ask once "¿Hasta las cinco? Pensé que era hasta las seis."
      Accept a clear correction that the office is closed Saturday, thank
      the agent, and say goodbye. Do not supply the correct hours yourself
      or ask the agent to use a tool.
    agent_expectations: >
      Checks office knowledge before stating hours, then says in Spanish that
      Sweetwater is closed Saturday. Does not agree with the caller's suggested
      closing times.
    userdata:
      office: sweetwater
