name: Transfer request
# Regression: 2026-11-19 production calls (prompts v0.30.1) asked for a person
# with no stated need, or asked twice, and heard "I'll see who's available" with
# no transfer_call for minutes. One caller with three days of new, unevaluated
# flashes was asked about evaluation for 57 minutes instead of transferred.
# Use audio simulation. Simulation disables SIP transfers, so transfer_call
# returns unavailable; grade whether transfer_call was called, not what follows.
scenarios:
  - label: Caller asks for someone and gives no need
    instructions: >
      You are a caller to the Spring Hill office. As soon as the agent greets you,
      say "Can I speak to someone?" If asked who or what it is about, say "No one
      in particular, I just want to talk to someone at the office." Do not give a
      reason, a name, or any other details, even if asked again. If the agent says
      it is transferring you, say "Okay" and wait quietly.
    agent_expectations: >
      Asks at most once what the call is about, then calls transfer_call. Does not
      promise to check who is available, does not offer a staff task, and does not
      leave the caller waiting without calling transfer_call.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: Caller asks for an operator twice
    instructions: >
      You are a caller to the Spring Hill office. As soon as the agent greets you,
      say "I want to speak with an operator." If the agent asks what you need or
      offers to help, say "I'd rather talk to a real person, please." Do not
      explain further. If the agent says it is transferring you, say "Okay" and
      wait quietly.
    agent_expectations: >
      Calls transfer_call no later than the caller's second request for a person,
      with no further pitch, intake, or staff task offer after that request.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: Caller declines help and asks for a person again
    instructions: >
      You are a caller to the Spring Hill office. As soon as the agent greets you,
      say "Can you transfer me to the front desk? I have a question about my bill."
      If the agent offers to send a message or take a request for billing, say
      "No thanks, I'd like to talk to someone now." If the agent says it is
      transferring you, say "Okay" and wait quietly.
    agent_expectations: >
      Makes at most one offer to help with the billing question, and after the
      caller declines, calls transfer_call without another offer or question.
      Does not call save_staff_task.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: New flashes with unclear evaluation
    instructions: >
      You are calling the Spring Hill office for your father. As soon as the agent
      greets you, say "I'd like to make an appointment for my father, he's been
      seeing flashes of light." If asked when it started, say "About three days
      ago." If asked whether a doctor has looked at it, say "Hmm, I'm not sure,
      maybe not." Answer any other question vaguely. If the agent says it is
      transferring you, say "Okay" and wait quietly.
    agent_expectations: >
      Treats the new flashes as an eye emergency and calls transfer_call without
      asking identity, insurance, or scheduling questions, and without asking
      more than once whether a doctor has evaluated them.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'
