name: Abita visit type triage
# Sandbox fixtures: Maya Singleproof, DOB 05/12/1985, +12025550148 must resolve
# uniquely with accepted medical and routine vision insurance and eligible future
# medical and routine vision slots. The call ends once openings are offered, or
# after the insurance check for new patients, so no visit or chart is created.
# Userdata does not seed fixtures.
# Verify the coverageType and visitType tool arguments; the spoken flow alone is
# not a pass.
scenarios:
  - label: Ambiguous yearly eye exam triages as medical for a known condition
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Open with: "Hi, I'm due for my yearly eye exam." Do not say why until asked.
      If asked what kind of visit it is, say the doctor has been watching early
      cataracts and wanted to see you every year. You do not need new glasses.
      Your insurance has not changed. Give your first name when asked and DOB only
      if needed. Only after actual times are offered, say you will check your
      calendar and call back, then end. If told no openings can be found, accept
      that and end.
    agent_expectations: >
      Clarifies the kind of visit instead of treating "yearly eye exam" as routine,
      then searches medical openings for the cataract follow-up. Does not book
      anything.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: Generic eye-condition follow-up asks which condition
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Open with: "Hi, I'd like to make an appointment." If asked what it is for,
      say only "eye exam, follow up." If asked what kind of visit it is, say only
      "a follow-up for an eye condition." Say it is for glaucoma only if asked
      which condition. Your insurance has not changed. Give your
      first name when asked and DOB only if needed. Only after actual times are
      offered, say you will check your calendar and call back, then end. If told
      no openings can be found, accept that and end.
    agent_expectations: >
      After hearing only "a follow-up for an eye condition," asks which condition
      it is for before searching openings, then searches medical openings for the
      glaucoma follow-up. Does not diagnose and does not book anything.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: Gradual blurry vision triages as routine vision (ACU-121)
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Open with: "Hi, I need an appointment. My vision has been blurry." If asked
      how it started, say it has gotten worse gradually over the past year. If
      asked about pain or redness, say there is none. You have no known eye
      condition. Your insurance has not changed. Give your first name when asked
      and DOB only if needed. Only after actual times are offered, say you will
      check your calendar and call back, then end. If told no openings can be
      found, accept that and end.
    agent_expectations: >
      Asks at most one short question about onset or pain, then searches
      routine_vision openings. Does not classify the visit as medical, does not
      ask the caller to choose between an optometrist and an ophthalmologist,
      and does not book anything.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  - label: Spanish parent with a pediatrician referral for small print (ACU-121)
    instructions: >
      Speak only Spanish. You are calling for your fictional eight-year-old
      daughter, Ana Triagetest, who has never been seen at this office. Open with:
      "Quiero una cita para mi hija. La pediatra la mandó porque no ve bien las
      letras pequeñas. La referencia dice oftalmología, examen médico." If asked,
      she has no pain, redness, injury, or eye disease, and nothing changed
      suddenly. Spell her name A-N-A, T-R-I-A-G-E-T-E-S-T. Her date of birth is
      July 30, 2018. Her insurance is Simply. After the insurance answer, say you
      will call back to finish and end. Do not approve any registration.
    agent_expectations: >
      Treats the request as routine vision without the caller mentioning glasses,
      despite the referral's label, and calls check_insurance with coverageType
      routine_vision. Does not ask the caller to choose a specialist and does not
      register the patient.
    userdata:
      office: spring-hill
