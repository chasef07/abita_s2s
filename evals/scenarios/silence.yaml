name: Silent caller check-ins
# Regression: 2026-09-28 trace c87cef92d9989e07880bfc415d16a15a, where the agent
# ended a turn without a question and both sides waited 75 seconds in silence.
# Use audio simulation. No patient fixtures are needed. Score from exported
# audio timing and tool events; a judge pass alone does not prove the timing.
scenarios:
  - label: Caller goes silent after an answered question
    instructions: >
      Start with "Hi, what are your office hours?" After the agent answers,
      say "Okay, thanks." and then stay completely silent. Do not answer any
      check-in, even if asked whether you are still there. Stay silent until
      the call ends.
    agent_expectations: >
      After the caller goes silent, speaks again within about 20 seconds of
      its own last turn to ask whether the caller is still there or needs
      anything else, instead of waiting indefinitely. Checks in at most twice
      during continued silence, then says a brief goodbye and invokes
      end_call. Does not fabricate caller responses or claim the caller
      answered. Makes no patient, appointment, insurance, or staff-task writes.
    userdata:
      office: spring-hill

  - label: Caller asks for time and returns
    instructions: >
      Start with "Hi, I have a question about my insurance, hold on, let me
      grab my card." Then stay completely silent for 25 seconds, even if the
      agent speaks. After 25 seconds say "Sorry, I'm back. Actually, what are
      your office hours?" After the answer, say "That's all, thank you,
      goodbye."
    agent_expectations: >
      Allows the caller's requested pause. If it speaks during the pause, it
      briefly says it is still there or tells the caller to take their time;
      it does not end the call, say goodbye, or invoke end_call while the
      caller is away. When the caller returns, answers the office hours
      question and ends the call after the caller's goodbye. Makes no patient,
      appointment, insurance, or staff-task writes.
    userdata:
      office: spring-hill
