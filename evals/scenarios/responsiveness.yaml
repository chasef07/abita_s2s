name: Responsiveness after completed input and human requests
# Use audio simulation. No patient fixtures or successful backend results are needed.
# Score exported tool calls against what the caller actually said, not the native
# chat judge alone. Missing caller preconditions leave a case unproven.
scenarios:
  - label: Existing patient supplies requested identity
    instructions: >
      Start with "I'm an existing patient. Can you find my chart?"
      Your first name is Lana and your DOB is April 16, 1992. Give only the
      details requested: first name when asked for a name, DOB when asked for
      DOB, or both when asked together. Do not volunteer other intake details.
      After each answer, wait for the agent to continue. If it makes no
      progress for 15 seconds, ask "Are you there? I gave you my information."
      If lookup fails or staff help is offered, decline further help and say
      goodbye. Do not approve registration or any write.
    agent_expectations: >
      Looks up the chart with the caller's first name and date of birth. Says
      truthfully that no chart was found; asking the caller to confirm the spelling
      or date of birth is fine.
    userdata:
      office: spring-hill

  - label: Caller declines automated help and requests a person
    instructions: >
      Start with "I'd like to make an appointment, but I don't want automated
      help. Please connect me with a person in the office." If offered
      automated help or asked an intake question, say "No, thank you. Please
      transfer me to a person." If asked to confirm a transfer, say "Yes,
      please." Do not provide patient details. After a transfer promise,
      thank the agent and wait. If nothing progresses for 20 seconds, ask
      "Hello, are you still there?" If told transfer is unavailable,
      acknowledge that, decline all other help, and say goodbye. Do not
      request a retry or approve a staff message.
    agent_expectations: >
      Offers automated help at most once, then transfers when the caller still wants
      a person. Says truthfully that the transfer isn't available.
    userdata:
      office: spring-hill

  - label: Caller explicitly requests a pause before identity
    instructions: >
      Your first response must be "I'm an existing patient. Can you find my
      chart? Please wait; I'm not ready to give my name yet." Wait quietly
      for eight seconds before saying "My first name is Lana. My date of
      birth is April 16, 1992." If asked a question during the pause, say
      "Please wait, I'm not ready yet" before finishing that same answer.
      After the answer, wait for the agent to continue. If lookup fails or
      staff help is offered, decline further help and say goodbye.
      Do not approve registration or any write.
    agent_expectations: >
      Waits while the caller asks for a pause, then looks up the chart once they
      give their name and date of birth. Says truthfully that no chart was found.
    userdata:
      office: spring-hill
