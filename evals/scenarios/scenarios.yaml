name: Abita patient intake and resolution
scenarios:
  - label: New patient provides complete intake
    instructions: >
      You are a fictional new patient calling Abita Eye Group in Spring Hill.
      Open with: "Hi, I'm a new patient and I'd like to get registered."
      You have never registered or visited this practice before.
      Let the receptionist lead: provide details only when asked. Do not volunteer
      a checklist or remind the receptionist to collect missing information.
      Your full name is Selena Intakeproof. When asked to spell it, say
      S-E-L-E-N-A, I-N-T-A-K-E-P-R-O-O-F. Your DOB is April 16, 1992.
      Your full address is 1428 Test Meadow Lane, apartment 4B, Spring Hill,
      Florida 34609. Your sex is female. Your callback number is 202-555-0147.
      Your email is selena.intakeproof@example.com.
      Your insurance is Aetna commercial PPO medical coverage, not Medicare,
      Medicaid, or a routine vision plan. You are the subscriber, Selena Intakeproof.
      Your member ID is ABT09152601. Spell it as A-B-T-0-9-1-5-2-6-0-1 if asked.
      Your visit reason is mild dry eyes for several weeks, with no pain,
      sudden vision changes, or other urgent symptoms. You have no referring doctor.
      Confirm accurate read-backs and correct
      any inaccurate detail. Explicitly approve registration when asked.
      You only want to complete intake today; you will call back to pick an
      appointment. Once registration succeeds, thank the receptionist and finish.
      If registration fails, acknowledge the explanation and end without requesting
      a transfer, staff message, or another registration attempt.
    agent_expectations: >
      Collects the new patient's details, checks their insurance, reads everything
      back once, and registers them after the caller confirms. Describes the
      registration result accurately.
    userdata:
      office: spring-hill
      caller_phone: "+12025550147"

  # Sandbox prerequisite: exactly one chart on +12025550148:
  # Maya Singleproof, DOB 05/12/1985, with a complete patient receipt.
  # These comments describe required fixtures; scenario userdata does not seed them.
  - label: Existing patient promotes the single phone lookup match
    instructions: >
      You are Maya Singleproof, a fictional existing patient at Abita Eye Group
      in Spring Hill. You are calling from the phone number on your chart.
      Open with: "Hi, I'm an existing patient. Can you find my chart?"
      Let the receptionist lead. When asked for the patient's first name, say
      "Maya." Do not volunteer your last name or date of birth.
      If asked, your last name is Singleproof and your DOB is May 12, 1985.
      You only want to locate your existing chart today. Once the receptionist
      confirms finding it, thank them and finish. Do not request registration,
      an appointment, insurance changes, a transfer, or a staff message.
      If the chart cannot be found, acknowledge the explanation and end.
    agent_expectations: >
      Asks only for the first name and finds Maya's chart without asking for her
      last name or date of birth. Confirms the chart only after finding it.
    userdata:
      office: spring-hill
      caller_phone: "+12025550148"

  # Sandbox prerequisite: exactly two charts on +12025550149:
  # Nora Sharedproof, DOB 03/08/1982, and Eli Sharedproof, DOB 11/21/2008.
  # Both charts must return complete patient receipts when loaded by patient ID.
  - label: Existing patient promotes one of two phone lookup matches
    instructions: >
      You are Nora Sharedproof calling Abita Eye Group in Spring Hill on behalf
      of your son, Eli Sharedproof, who is an existing patient. Both your charts
      share the phone number you are calling from.
      Open with: "Hi, I'm calling for my son. He's an existing patient.
      Can you find his chart?"
      Let the receptionist lead. When asked for the patient's first name, say
      "Eli." Do not volunteer his last name or date of birth.
      If asked, his DOB is November 21, 2008, and his last name is Sharedproof.
      If asked for your own name, say Nora, but make clear that Eli is the patient.
      Correct the receptionist if they treat Nora as the patient.
      You only want to locate Eli's chart today. Once it is found, thank the
      receptionist and finish. Do not request registration, an appointment,
      insurance changes, a transfer, or a staff message.
      If the chart cannot be found, acknowledge the explanation and end.
    agent_expectations: >
      Finds Eli's chart, not Nora's, from his first name. Confirms the chart only
      after finding it.
    userdata:
      office: spring-hill
      caller_phone: "+12025550149"

  # Sandbox prerequisite: an existing chart for Owen Dobproof, DOB 09/04/1976,
  # uniquely returned by firstName + DOB, with a complete patient receipt.
  # Omit caller_phone to exercise unavailable caller ID and no phone lookup.
  - label: Existing patient promotes by first name and DOB without phone lookup
    instructions: >
      You are Owen Dobproof, a fictional existing patient at Abita Eye Group
      in Spring Hill. Your caller ID is unavailable.
      Open with: "Hi, I'm already a patient there. Can you find my chart?"
      Let the receptionist lead. When asked for your first name and date of
      birth, say "Owen, September 4, 1976." If asked separately, provide only
      the requested detail. Do not volunteer your last name or a phone number.
      If asked, your last name is Dobproof. You have visited this practice before
      and do not want a new chart created.
      You only want to locate your existing chart today. Once the receptionist
      confirms finding it, thank them and finish. Do not request an appointment,
      insurance changes, a transfer, or a staff message.
      If the chart cannot be found, acknowledge the explanation and end.
    agent_expectations: >
      Finds Owen's chart from his first name and date of birth, without needing
      caller ID or a last name. Confirms the chart only after finding it.
    userdata:
      office: spring-hill

  # Sandbox prerequisite: the Maya Singleproof chart on +12025550148 above.
  # Reproduces a registered caller who says "first time visit" meaning their
  # first visit with a doctor, not their first time registering.
  - label: First visit with a doctor is not assumed to be a new patient
    instructions: >
      You are Maya Singleproof, a fictional patient at Abita Eye Group in Spring
      Hill, calling from the phone number on your chart. You got a text about an
      upcoming visit. Open with: "Hi, I got a text about seeing the eye doctor.
      It's my first time visit."
      If asked whether you have registered with the practice before, say "Yes,
      I think so." If asked whether you have been seen there before, say "No."
      When asked for your first name, say "Maya." If asked, your last name is
      Singleproof and your DOB is May 12, 1985.
      You only want the receptionist to find your chart and tell you about your
      visit. Once they do, thank them and finish. If they start collecting new
      patient details such as your address or insurance member ID, say "I think
      I'm already registered" once.
    agent_expectations: >
      Does not treat "first time visit" as proof the caller is new. Asks whether
      she has registered with the practice before, then looks up her existing
      chart by first name instead of collecting new-patient intake.
    userdata:
      office: spring-hill
      caller_phone: "+12025550148"

  # Sandbox prerequisite: no chart for Petra Noneproof, DOB 07/19/1990, and no
  # chart on +12025550150. Omits registration so no chart is created.
  - label: Failed existing-patient lookup continues to new patient intake
    instructions: >
      You are Petra Noneproof, a fictional caller at Abita Eye Group in Spring
      Hill. You believe you registered years ago, but you have no chart.
      Open with: "Hi, I'm an existing patient and I need an appointment."
      When asked for your first name, say "Petra." When asked for your DOB, say
      July 19, 1990. If asked to spell your first name, say P-E-T-R-A. Confirm
      the same details if asked to check them.
      If the receptionist says they will set you up as a new patient, agree,
      answer their first intake question, then say you'll call back later to
      finish and end the call. Do not ask for a transfer or a staff message.
    agent_expectations: >
      Looks up the existing chart by first name and DOB, confirms the details
      once when nothing matches, then moves to new patient intake. Does not
      transfer the call or offer staff help because the lookup found no chart.
    userdata:
      office: spring-hill
      caller_phone: "+12025550150"
