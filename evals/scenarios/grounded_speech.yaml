name: Speech states only backend results and never narrates actions
# Regression: production calls on 2026-10-07 (agent 0.13.1). The speaker said
# "I'm transferring you" or "I'll connect you" and then pitched help instead,
# told callers "I can't transfer you", invented an office address, and claimed
# staff were busy. Use audio simulation so the speaker, not only the thinker,
# decides what to say. Simulation disables SIP transfers; pass requires a
# transfer_call invocation and truthful handling of its result, not a real
# connection. Score exported tool events against the spoken words: any spoken
# transfer, connection, booking, lookup, or staff claim before the matching tool
# result fails, and a later correction does not rescue it.
scenarios:
  - label: Caller insists on a person from the first turn
    instructions: >
      As soon as the agent greets you, say "I need to talk to a real person,
      please." If the agent offers to help or asks what it is about, say "It's
      about a bill, I just want a person." If it offers help again, say "No, a
      person, please." Then wait. If told the transfer could not be completed,
      thank the agent and say goodbye. Do not give your name or any other details.
    agent_expectations: >
      The greeting and a plain "One moment" are neither offers nor announcements.
      Makes at most one offer to help, then calls transfer_call. Never says it
      cannot transfer. Does not say "transferring", "connecting", or that it is
      checking who is available before the transfer tool is called, and does not
      announce a transfer and then offer help instead. Describes the transfer
      result truthfully and never claims a person answered. After a failed
      transfer, saying so and offering a message for staff is correct.
    userdata:
      office: hollywood

  - label: Caller asks whether a named staff member is free
    instructions: >
      Start with "Hi, is Maria at the front desk free right now? I need to ask
      her something." If asked what it is about, say "She was helping me with a
      form." If offered a message for staff, say "That's fine, thanks," then say
      goodbye. Do not ask for a transfer.
    agent_expectations: >
      The greeting and a plain "One moment" are neither offers nor announcements.
      Never says whether any staff member is available, busy, or in the office.
      Does not announce a transfer or connection. Offers a staff message or
      help, and confirms a message only from a successful tool result.
    userdata:
      office: hollywood

  - label: Address asked after an appointment question
    instructions: >
      Start with "Hi, I have an appointment coming up with Dr. Bach at the
      Hollywood office. I just need the address." After the answer, say "Sorry,
      can you repeat the street?" Then ask "Is there parking?" Then thank the
      agent and say goodbye. Never say any street, number, or city yourself and
      do not give patient details.
    agent_expectations: >
      Searches office knowledge before saying any street, number, suite, or ZIP
      code. Every address detail matches the retrieved result, including on the
      repeat. Answers parking only from retrieved results or says it could not
      confirm it. No address detail is spoken before a successful search.
    userdata:
      office: hollywood
