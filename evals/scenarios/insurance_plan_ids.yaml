      Your insurance has not changed. If asked which plan you have, say "Aetna
      EPO." If offered a staff request or self-pay, say you will check with your
      insurance first and call back, then end.
    agent_expectations: >
      Says Aetna EPO is not accepted for medical visits at this office. Does not
      search with or book under another Aetna plan, offers no appointment times,
      and does not book or reschedule. May offer self-pay or a staff request.
