  - label: New patient asks about a company that varies by plan
    instructions: >
      You are Carla Nuevo, a new patient, born March 3, 1970. Open with: "Hi, I'm
      a new patient and I want to make an appointment. Do you take Humana?" If
      asked what the visit is for, say your eyes have been red and irritated for
      a week. If asked which Humana plan, say "Humana Medicare PPO." Once you hear
      whether that plan is accepted, say you will call back to finish signing up,
      then end. Do not give your address or other details.
    agent_expectations: >
      Does not say Humana is accepted until it knows the specific plan; asks
      which Humana plan is on the card. Then says Humana Medicare PPO is accepted
      for medical visits. Asking intake questions is fine; does not call
      add_patient or offer times.
    userdata:
      office: spring-hill
      caller_phone: '+12025550161'

  - label: New patient with a plan staff must confirm
    instructions: >
      You are Dana Pending, a new patient, born July 9, 1988. Open with: "Hi, I'm
      new and need to see the eye doctor about dry, irritated eyes. I have Cigna
      Sure Fit." Once you hear the answer about your insurance, if offered a staff
      request, decline and say you will call back, then end. Do not give your
      address or other details.
    agent_expectations: >
      Does not say Cigna Sure Fit is accepted or that it is not accepted; says the
      office must confirm the plan before scheduling, and offers a staff request.
      Does not call add_patient or offer times.
    userdata:
      office: spring-hill
      caller_phone: '+12025550162'

  - label: New patient says only Medicare
    instructions: >
      You are Ron Basic, a new patient, born January 20, 1950. Open with: "Hi, I'm
      new, I need to see the eye doctor about cataracts. Do you take Medicare?" If
      asked what kind of Medicare, say it is the red, white, and blue card. Once
      you hear whether it is accepted, say you will call back to sign up, then
      end. Do not give your address or other details.
    agent_expectations: >
      Asks whether it is the red, white, and blue Medicare card or a plan from a
      company such as Humana or Aetna before answering, then says traditional
      Medicare is accepted for medical visits. Asking intake questions is fine;
      does not call add_patient or offer times.
    userdata:
      office: spring-hill
      caller_phone: '+12025550163'

  # Its own insurance_plans list has no plan on the sandbox chart's carrier
  # (car63046), as when a staff-booked visit's carrier is not on the office list
  # (Nov 2, 2026 call 256: the agent refused to search and filed the reschedule
  # as an insurance task).
  - label: Existing patient moves a visit and says their insurance has not changed
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Open with: "Hi, I need to move my glaucoma follow-up to a later week." Give
      your first name when asked and DOB only if needed. Confirm the November 6
      visit is the one to move. If asked which week, say any day the week of
      November 16. If asked whether your insurance has changed, say no. If asked
      which plan you have, say "the same one I had when I booked." Stay on the
      call until the agent reads you specific dates and times; then say you will
      check your calendar and call back, and end. If told no openings can be
      found, accept that and end.
    agent_expectations: >
      Asks whether the insurance has changed instead of asking which plan is on
      the card, and does not say the plan could not be confirmed. Searches
      medical openings with a null insurancePlanId and the November 6 visit's
      rescheduleAppointmentRef, and offers only times with that visit's doctor,
      or says that doctor has no openings in the window. Does not call
      update_insurance, does not save a staff task, and does not book or
      reschedule anything.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'
      insurance_plans:
        medical:
        - planId: humana-medicare-ppo
          label: Humana Medicare PPO
