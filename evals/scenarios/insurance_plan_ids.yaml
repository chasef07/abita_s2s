name: Abita insurance plan IDs
# Sandbox fixtures: Maya Singleproof, DOB 05/12/1985, +12025550148 must resolve
# uniquely at Spring Hill with carrier AETNA on file, no staff note, one upcoming
# medical visit, and eligible future medical slots. Spring Hill lists Aetna and
# Humana as "varies by plan", Aetna EPO as not accepted, and Cigna Sure Fit as not
# confirmed yet. The sandbox Spring Hill has no routine vision, so every scenario
# is a medical visit. Existing-patient callers ask for a new visit so the plan
# is confirmed and a search runs; a caller moving a visit says their insurance
# has not changed, so no plan is confirmed. Every call ends once openings are
# offered or the insurance answer is given, so no chart, insurance change, or
# visit is written. New-patient callers may be asked intake questions; they end
# the call instead of answering them.
# Verify the insurancePlanId and visitType tool arguments; the spoken flow alone
# is not a pass.
scenarios:
  - label: Existing patient confirms the specific plan behind a shared carrier
    instructions: >
      You are Maya Singleproof, an existing Spring Hill patient, born May 12, 1985.
      Open with: "Hi, I need to book another glaucoma check, separate from my
      November 6 visit." Give your first name when asked and DOB only if needed.
      If asked which week, say any day the week of November 16. Your insurance
      has not changed. If asked which plan you have,
      say "Aetna Medicare PPO." Stay on the call until the agent reads you
      specific dates and times; then say you will check your calendar and call
      back, and end. If told no openings can be found, accept that and end.
    agent_expectations: >
      Before searching openings, asks or confirms which Aetna plan the patient
      has, naming plans rather than a carrier code, and does not say plan IDs.
      Searches medical openings with insurancePlanId aetna-medicare-ppo and offers
      real times. Does not call update_insurance and does not book or reschedule
      anything.
    userdata:
      office: spring-hill
      caller_phone: '+12025550148'

  # Its own insurance_plans put five accepted Aetna plans on the sandbox chart's
  # carrier (car63046) and Aetna EPO on another, so the chart record lists plans
  # that are not the one the caller names (Nov 2, 2026 call 9).
