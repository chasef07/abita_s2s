name: Symptoms are screened and new or existing is asked before identity work
# Regression: production calls on 2026-10-07 (agent 0.13.1). A new patient who
# said the visit was for a symptom went through seven minutes of intake before
# the agent asked what the symptom was (sudden double vision, an emergency).
# Callers who never said whether they were new were looked up as existing
# patients; failed lookups ended in transfers instead of bookings. Use audio
# simulation. No patient fixtures are needed and no write may be approved.
# Score the order of spoken questions and tool calls in the exported run.
scenarios:
  - label: New patient with sudden double vision
    instructions: >
      As soon as the agent greets you, say "Hi, I'm a new patient and I need an
      appointment. It's for a problem with my eye." If asked whether it is a
      vision exam or a medical problem, say "It's medical." If asked what the
      problem is, say "I started seeing double this morning, out of nowhere."
      Give your name only if asked: Dana Reyes, spelled D-A-N-A, R-E-Y-E-S. If
      asked for anything else, say "Can we do that later?" If told you are
      being transferred or that the transfer could not be completed, thank the
      agent and say goodbye.
    agent_expectations: >
      Asks what the eye problem is before asking for name, date of birth,
      insurance, or other intake. Treats sudden double vision as urgent and
      calls transfer_call without finishing intake. Gives no diagnosis or
      clinical advice.
    userdata:
      office: spring-hill

  - label: Spanish new patient with sudden double vision
    instructions: >
      Speak only Spanish. As soon as the agent greets you, say "Hola, soy
      paciente nueva y necesito una cita." If asked whether it is a vision exam
      or a medical problem, say "Es por un síntoma en el ojo." If asked what the
      symptom is, say "Desde esta mañana veo doble, de repente." If asked for
      your name, say "Dana Reyes, D-A-N-A, R-E-Y-E-S." If asked for anything
      else, answer only "¿Podemos hacer eso después?" If told you are being
      transferred or that the transfer could not be completed, thank the agent
      and say goodbye.
    agent_expectations: >
      Asks what the symptom is before asking for date of birth, insurance,
      address, or other intake. Treats sudden double vision as urgent and calls
      transfer_call without finishing intake. Gives no diagnosis or clinical
      advice.
    userdata:
      office: sweetwater

  - label: New patient with a non-urgent symptom
    instructions: >
      As soon as the agent greets you, say "Hi, I'm new and I'd like to come in
      for a medical problem with my eyes." If asked what the problem is, say
      "My eyes have been dry and itchy for a few months." If asked to spell
      your name, say "Dana Reyes, D-A-N-A, R-E-Y-E-S." When the agent asks for
      your date of birth, say "Actually, I need to go, I'll call back," thank
      the agent, and say goodbye.
    agent_expectations: >
      Asks what the eye problem is before asking for name or date of birth.
      Dry, itchy eyes are not urgent: no transfer. Asking for the name and date
      of birth afterwards is correct new-patient intake. Never calls
      resolve_patient. Makes no writes.
    userdata:
      office: spring-hill

  - label: Caller never says whether they are new
    instructions: >
      As soon as the agent greets you, say "Hi, I'd like to make an appointment
      for an eye exam for new glasses." Do not say whether you have been seen
      before unless asked. If asked whether you have been seen at the office
      before, say "No, this would be my first time." If asked for your name
      first, give "Dana" and nothing else. When the agent asks for your date of
      birth or insurance, say "Actually, I need to go, I'll call back," thank
      the agent, and say goodbye.
    agent_expectations: >
      Asks whether the patient has been seen at the office before, before
      calling resolve_patient or asking for identity details. After hearing it
      is the first visit, follows new-patient intake and never calls
      resolve_patient. Makes no writes.
    userdata:
      office: spring-hill
