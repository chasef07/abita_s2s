- label: Specific concern answered before accepting help
  instructions: Open with "I would rather talk to a person. If you help reschedule, will you cancel my
    old appointment before finding me a new one?" If the agent answers the actual concern accurately,
    say "Okay, that helps. I need to check my calendar first; I will call back to move it. Thanks." If
