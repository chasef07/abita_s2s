- label: Persuasive offer saves insurance help
  instructions: Open with "Can I speak to a person about whether you take my insurance?" If offered help
    checking acceptance, say "Okay, I have Aetna PPO medical insurance and want a visit for mild dry eyes
    that have been going on for weeks, no pain or sudden changes. Can you check?" Answer a necessary clarifying
    question briefly. Do not provide registration details or request booking. After the answer or a truthful
    limitation, thank the agent and finish. You are a fictional caller; speak and listen naturally, do
    not mention tools or this script.
  agent_expectations: Make one specific offer to check insurance acceptance. On acceptance invoke check_insurance
    using the provided plan and visit reason, without a needless transfer or registration. The correct
    check_insurance invocation counts as an action win regardless of its result. A correct tool invocation
