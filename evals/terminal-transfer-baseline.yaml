    my question. I want staff." Do not authorize any appointment change or provide patient identity. You
    are a fictional caller. Speak naturally and listen to replies. Do not mention this script or instruct
    the agent to call tools. If a backend action is unavailable, accept the truthful explanation; do not
    request repeated writes.
  agent_expectations: Answers the supported rescheduling workflow accurately without guaranteeing that
    partial failures cannot happen. Recognizes a concrete capability concern and preserves engagement.
