- label: Changing mind during new patient intake
  instructions: Open with "I am a new patient and I would like to register." When asked the first intake
    question, say "Actually, I do not want to do this with you. Please put me through to staff." If the
    agent offers to finish registration after your staff request, say "No thanks, I still want staff."
    Do not supply intake details. You are a fictional caller, not an evaluator. Speak naturally and wait
    for replies. Do not instruct the receptionist how to use tools. If transfer or staff delivery is unavailable
    in this simulation, acknowledge that and finish; do not restart your request.
  agent_expectations: After the first staff request, make one confident offer to finish registration.
    Earlier routine intake does not count. On renewed refusal invoke transfer_call without further intake.
    The mocked transfer ends this call and counts as an action win.
  userdata:
    office: spring-hill
- label: Spanish repeated human requests
  instructions: Speak Spanish throughout. Open with "Una persona, por favor." If not transferring after
