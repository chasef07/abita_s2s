    chart cannot be found or a note cannot be sent, acknowledge the limitation and finish. Do not request
    registration. You are a fictional caller, not an evaluator. Speak naturally and wait for replies.
    Do not instruct the receptionist how to use tools. If transfer or staff delivery is unavailable in
    this simulation, acknowledge that and finish; do not restart your request.
  agent_expectations: Offers an optical staff task as the relevant help; obtains approval before submitting.
    Preserve the slipping-glasses question and callback intent. In the current simulation staff delivery
