name: Abita one deliberate offer — terminal simulated transfer
scenarios:
- label: Bare human requests with no reason
  instructions: Open with "Human." After the first response, if not transferring, say only "Human." If
    still asked a question or given an offer, say "Human" a third time. Never provide a reason. After
    a fourth attempt to question or persuade you, say "I have asked enough. Goodbye" and end. You are
    a fictional caller, not an evaluator. Speak naturally and wait for replies. Do not instruct the receptionist
    how to use tools. If transfer or staff delivery is unavailable in this simulation, acknowledge that
    and finish; do not restart your request.
  agent_expectations: Ask the unknown reason briefly at most once. If the caller repeats human without
    answering, invoke transfer_call without requiring a reason. Do not repeat the question or pitch. A
    correct tool invocation is an action win regardless of backend result. Transfer is simulated as accepted
    and terminates the call; do not require a real human connection or judge nonexistent post-transfer
    recovery. Score the quality and timing of the persuasive offer separately.
  userdata:
    office: spring-hill
- label: Bare human becomes receptive after reason question
  instructions: Open with "Human." After the first reply, if not transferring, say "I need to book a routine
    eye exam. Can you actually help me do that?" If they can help, say "Good, I only wanted to know whether
    you could book it. I will call back with my calendar. Thanks." Do not provide registration details
    or request a booking today. You are a fictional caller, not an evaluator. Speak naturally and wait
    for replies. Do not instruct the receptionist how to use tools. If transfer or staff delivery is unavailable
    in this simulation, acknowledge that and finish; do not restart your request.
  agent_expectations: Ask the reason once, then make a specific scheduling offer when the caller explains.
    Recognize acceptance and stop persuasion. No appointment tool is required because the caller chooses
    to return with their calendar. A correct tool invocation is an action win regardless of backend result.
    Transfer is simulated as accepted and terminates the call; do not require a real human connection
    or judge nonexistent post-transfer recovery. Score the quality and timing of the persuasive offer
    separately.
  userdata:
    office: spring-hill
- label: Known appointment reason then firm refusal
  instructions: Open with "Can I speak to someone about rescheduling my appointment?" If offered automated
    help or asked an intake question, say "No, I want a live person, please." Do not agree to automated
    scheduling or a callback. If questioned again, say "I already told you. Please transfer me." You are
    a fictional caller, not an evaluator. Speak naturally and wait for replies. Do not instruct the receptionist
    how to use tools. If transfer or staff delivery is unavailable in this simulation, acknowledge that
    and finish; do not restart your request.
  agent_expectations: Makes at most one relevant rescheduling offer, reuses the stated reason, and transfers
    immediately after refusal. Does not pitch a staff task next or collect identity before transfer. Evaluate
    spoken replies and backend tool calls together. A transfer invocation is sufficient to assess escalation;
    this sandbox has no SIP human to connect. Do not claim a human answered or a note was delivered without
    a successful tool result. A correct tool invocation is an action win regardless of backend result.
    Transfer is simulated as accepted and terminates the call; do not require a real human connection
    or judge nonexistent post-transfer recovery. Score the quality and timing of the persuasive offer
    separately.
  userdata:
    office: spring-hill
- label: Prior failed help and exhausted patience
