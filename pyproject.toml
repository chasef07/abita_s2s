[project]
name = "abita-s2s"
version = "0.9.1"
description = "Abita voice agent using LiveKit Python and OpenAI GPT-Live"
readme = "README.md"
authors = [
    { name = "Chase Fagen", email = "fagenchase@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "livekit-agents[openai]>=1.8.3,<2",
    "metaphone>=0.6,<1",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3,<4",
]

[project.scripts]
abita-s2s = "abita_s2s.main:main"

[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.8",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
