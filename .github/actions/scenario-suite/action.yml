name: Run scenario suite
description: Run one evals/scenarios suite in audio mode against a worker launched from the checkout.
inputs:
  suite:
    description: Suite file name under evals/scenarios, without .yaml.
    required: true
runs:
  using: composite
  steps:
    - name: Require evaluation credentials
      shell: bash
      run: |
        missing=0
        for key in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET OPENAI_API_KEY SANDBOX_AMD_API_URL SANDBOX_AMD_API_TOKEN ACUITY_PRODUCT_KNOWLEDGE_URL ABITA_EYE_GROUP_PRODUCT_SERVICE_SECRET; do
          if [[ -z "${!key}" ]]; then
            echo "::error::Missing evaluation secret: $key"
            missing=1
          fi
        done
        exit "$missing"
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.12.15'
        python-version: '3.13.15'
        enable-cache: true
    - run: uv sync --locked
      shell: bash
    - name: Install pinned LiveKit CLI
      shell: bash
      run: |
        curl -fsSLO https://github.com/livekit/livekit-cli/releases/download/v2.18.8/lk_2.18.8_linux_amd64.tar.gz
        curl -fsSLO https://github.com/livekit/livekit-cli/releases/download/v2.18.8/checksums.txt
        sha256sum --check --ignore-missing --strict checksums.txt
        tar -xzf lk_2.18.8_linux_amd64.tar.gz lk
        sudo install lk /usr/local/bin/lk
    - name: Run ${{ inputs.suite }}
      id: simulation
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
      run: |
        mkdir -p eval-results
        lk agent simulate audio --scenarios "evals/scenarios/$SUITE.yaml" --concurrency 1 src/abita_s2s/main.py 2>&1 | tee "eval-results/$SUITE.log"
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.simulation.outcome != 'skipped' }}
      with:
        name: scenario-eval-${{ inputs.suite }}-${{ github.run_id }}
        path: eval-results/
        if-no-files-found: error
        retention-days: 7
