name: Verify
on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact release commit to verify
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.13.17'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Type check against the committed baseline
        run: uv run --no-sync basedpyright && git diff --exit-code .basedpyright/baseline.json
      - run: uv run --no-sync python -m unittest discover -s tests -q
      - run: uv run --no-sync python scripts/release.py "$(git rev-parse HEAD)"
      - name: Installed wheel and source smoke (no network)
        run: |
          uv venv /tmp/wheel-smoke
          uv pip sync --python /tmp/wheel-smoke/bin/python <(uv export --locked --no-dev --no-emit-project --format requirements-txt)
          uv pip install --python /tmp/wheel-smoke/bin/python --no-deps dist/*.whl
          (cd /tmp && /tmp/wheel-smoke/bin/python -m abita_s2s.release && /tmp/wheel-smoke/bin/abita-s2s start --help)
          uv pip install --python /tmp/wheel-smoke/bin/python --no-deps --reinstall dist/abita_s2s-*.tar.gz
          (cd /tmp && /tmp/wheel-smoke/bin/python -m abita_s2s.release)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image with cached dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: abita-s2s:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke without network or credentials
        run: |
          test "$(docker image inspect abita-s2s:verify --format '{{.Config.User}}')" = '10001'
          docker run --rm --network none --entrypoint /app/.venv/bin/python abita-s2s:verify -m abita_s2s.release
          docker run --rm --network none --entrypoint /app/.venv/bin/abita-s2s abita-s2s:verify start --help
          docker run --rm --network none --entrypoint /app/.venv/bin/python abita-s2s:verify -c 'from abita_s2s.main import server; assert server._agent_name == "abita-s2s", server._agent_name'
