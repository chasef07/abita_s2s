name: Publish release
on:
  workflow_call:
    inputs:
      commit:
        description: Exact verified release commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed 40-character main commit with a new pyproject version
        required: true
permissions:
  contents: read
concurrency:
  group: abita-s2s-release
  cancel-in-progress: false
jobs:
  on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$COMMIT" origin/main
        env:
          COMMIT: ${{ inputs.commit }}
  # Release runs arrive only after verify-release ran Verify on this exact commit.
  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: [on-main]
    uses: ./.github/workflows/ci.yml
    with:
      release_sha: ${{ inputs.commit }}
  release:
    if: >-
      !cancelled() &&
      needs.on-main.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.verify.result)
    needs: [on-main, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.13.17'
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/release.py "$COMMIT"
        env:
          COMMIT: ${{ inputs.commit }}
      - run: uv run --no-sync python scripts/publish_release.py dist
        env:
          GH_TOKEN: ${{ github.token }}
