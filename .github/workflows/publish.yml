name: Publish release
on:
  workflow_call:
    inputs:
      commit:
        description: Exact verified release commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed 40-character main commit with a new pyproject version
        required: true
permissions:
  contents: write
concurrency:
  group: abita-s2s-release
  cancel-in-progress: false
jobs:
  agent-contract:
    permissions:
      contents: read
    uses: Data-Buddies-Solutions/amd_middleware/.github/workflows/agent-contract.yml@59b30b9263703773f67b781c23bbbf54b3290af1
    with:
      agent_ref: ${{ inputs.commit }}
      middleware_ref: 59b30b9263703773f67b781c23bbbf54b3290af1

  release:
    needs: agent-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.13.15'
      - run: git merge-base --is-ancestor "$COMMIT" origin/main
        env:
          COMMIT: ${{ inputs.commit }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check . && uv run --no-sync python -m unittest discover -s tests -q
      - run: uv run --no-sync python scripts/release.py "$COMMIT"
        env:
          COMMIT: ${{ inputs.commit }}
      - run: docker build -t abita-s2s:release .
      - run: docker run --rm --network none --entrypoint /app/.venv/bin/python abita-s2s:release -m abita_s2s.release
      - run: uv run --no-sync python scripts/publish_release.py dist
        env:
          GH_TOKEN: ${{ github.token }}
